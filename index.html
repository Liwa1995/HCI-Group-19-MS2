<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotorPH pre-payroll check, interactive wireframe v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#cfd4d5;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:#1E2A2B}
#bar button{font:500 13px Inter,system-ui,sans-serif;border:0;border-radius:4px;padding:7px 12px;background:#33403f;color:#e6ecec;cursor:pointer}
#bar button[aria-pressed=true]{background:#EFEAF7;color:#4b3a78}
#label{color:#cfd8d8;font-size:13px;margin-left:8px}
#wrap{padding:16px;overflow:hidden}
#stage{transform-origin:0 0;width:1440px}
.frame{position:relative;overflow:hidden;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.el{position:absolute;box-sizing:border-box;margin:0;border:0;font-family:inherit}
.tri{width:0;height:0;border-style:solid}
button.el{cursor:default;display:block}
button.el.link{cursor:pointer}
button.el.link:hover{filter:brightness(.94)}
button.el:focus-visible{outline:3px solid #6B4FA0;outline-offset:2px}
.marker{position:absolute;display:none;width:26px;height:26px;border-radius:13px;background:#6B4FA0;color:#fff;font:600 13px/26px Inter,system-ui,sans-serif;text-align:center;box-shadow:0 0 0 3px #fff;z-index:5}
.notes-on .marker{display:block}
#notes{margin:0 16px 24px;padding:16px 20px;background:#EFEAF7;border-radius:8px;color:#2d2540;max-width:1100px}
#notes h2{font-size:15px;margin:0 0 8px}
#notes li{margin:6px 0;font-size:14px;line-height:1.45}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="bar"><button id="restart" type="button">Restart flow</button><span id="label" aria-live="polite"></span></div>
<div id="wrap"><div id="stage"></div></div><div id="notes" hidden></div>
<script>
// MotorPH pre-payroll check, mid-fidelity interactive wireframe, version 2.
// Concept Direction 1: help Rachel find a problem before an employee does.
// buildSpec("path") -> one clean click-through path for Figma.
// buildSpec("full") -> every state, so figures can be resolved in any order (HTML preview).

var C = {
  bg: "#F3F4F4", surface: "#FFFFFF", line: "#D5D9DA", lineSoft: "#E7EAEA",
  ink: "#1E2A2B", ink2: "#4B5759", ink3: "#7D8889", fill: "#EEF0F0",
  accent: "#16494A", accentSoft: "#E3EEEE",
  red: "#A83232", redSoft: "#F8E7E5", amber: "#8A5A06", amberSoft: "#FBF0D9",
  green: "#2E6B3A", greenSoft: "#E4F1E6", note: "#6B4FA0", noteSoft: "#EFEAF7"
};
var W = 1440, H = 1024, CX = 272, CW = 1136;

var BTN = {
  primary:   { fill: "#16494A", stroke: null, c: "#FFFFFF", wt: "Semi Bold", align: "CENTER", r: 6 },
  secondary: { fill: "#FFFFFF", stroke: "#B7BEBF", c: "#1E2A2B", wt: "Medium", align: "CENTER", r: 6 },
  disabled:  { fill: "#E7EAEA", stroke: null, c: "#9AA3A4", wt: "Medium", align: "CENTER", r: 6 },
  link:      { fill: null, stroke: null, c: "#16494A", wt: "Semi Bold", align: "LEFT", r: 4, u: true },
  nav:       { fill: null, stroke: null, c: "#4B5759", wt: "Medium", align: "LEFT", r: 6, pad: 12 },
  navActive: { fill: "#E3EEEE", stroke: null, c: "#16494A", wt: "Semi Bold", align: "LEFT", r: 6, pad: 12 }
};

function Screen(id, name) { this.id = id; this.name = name; this.w = W; this.h = H; this.els = []; this.notes = []; }
Screen.prototype.rect = function (x, y, w, h, o) {
  o = o || {}; this.els.push({ k: "rect", x: x, y: y, w: w, h: h, fill: o.fill || null, stroke: o.stroke || null,
    r: o.r || 0, dash: !!o.dash, name: o.name || "Rect" }); };
Screen.prototype.text = function (x, y, v, o) {
  o = o || {}; this.els.push({ k: "text", x: x, y: y, w: o.w || null, v: v, s: o.s || 14, wt: o.wt || "Regular",
    c: o.c || C.ink, align: o.align || "LEFT", u: !!o.u, name: o.name || v.slice(0, 40) }); };
Screen.prototype.btn = function (x, y, w, label, to, variant, o) {
  o = o || {}; this.els.push({ k: "btn", x: x, y: y, w: w, h: o.h || 40, v: label, to: to || null,
    variant: variant || "secondary", s: o.s || 14, align: o.align || null }); };
// Triangle arrowhead: dir is "r", "l", "d" or "u"; (x, y) is the tip.
Screen.prototype.tri = function (x, y, dir, color) {
  this.els.push({ k: "tri", x: x, y: y, dir: dir, fill: color || C.ink3, name: "Arrowhead" }); };
// Annotation marker. Rendered outside the prototype in Figma, toggleable in HTML.
Screen.prototype.note = function (x, y, title, body) {
  this.notes.push({ n: this.notes.length + 1, x: x, y: y, t: title, v: body }); };
function pillW(label, s) { return Math.round(label.length * ((s || 12) * 0.56) + 24); }
Screen.prototype.pill = function (x, y, label, tone, big) {
  var t = { neutral: [C.fill, C.ink2], red: [C.redSoft, C.red], amber: [C.amberSoft, C.amber],
    green: [C.greenSoft, C.green], accent: [C.accentSoft, C.accent] }[tone || "neutral"];
  var s = big ? 14 : 12, h = big ? 32 : 24, w = pillW(label, s) + (big ? 8 : 0);
  this.rect(x, y, w, h, { fill: t[0], r: h / 2, name: "Tag" });
  this.text(x, y + (h - s * 1.4) / 2, label, { w: w, s: s, wt: "Semi Bold", c: t[1], align: "CENTER" });
  return w;
};
Screen.prototype.card = function (x, y, w, h, title) {
  this.rect(x, y, w, h, { fill: C.surface, stroke: C.line, r: 8, name: title ? "Card: " + title : "Card" });
  if (title) this.text(x + 20, y + 18, title, { s: 16, wt: "Semi Bold" });
};
Screen.prototype.hr = function (x, y, w) { this.rect(x, y, w, 1, { fill: C.lineSoft, name: "Divider" }); };
Screen.prototype.toast = function (y, msg, tone) {
  var bg = tone === "amber" ? C.amberSoft : C.greenSoft, fg = tone === "amber" ? C.amber : C.green;
  this.rect(CX, y, CW, 52, { fill: bg, r: 8, name: "Confirmation message" });
  this.rect(CX + 20, y + 16, 20, 20, { fill: fg, r: 10, name: "Message icon" });
  this.text(CX + 52, y + 16, msg, { s: 14, wt: "Medium", c: fg, w: CW - 72 });
};

// ---------- Data from MS1: bonus, leave and tax figures ----------
// Order = priority order shown on the list (High first; follow-up before the low-risk tax check).
var ORDER = ["b", "l", "f", "t"];
var STEP_TONE = { match: ["Match", "green"], miss: ["Doesn't match", "red"], wait: ["Can't confirm yet", "amber"] };
var FIG = {
  b: { label: "Performance bonus", emp: "A. Santos", role: "Sales Associate", value: "PHP 8,500", fixed: "PHP 6,800",
    priority: "High", impact: "Overpaid by PHP 1,700",
    reason: "Uses bonus Scheme B, but the employee is assigned Scheme A",
    steps: [
      { name: "Records", rows: [["Used in payroll", "Base salary PHP 34,000"], ["Employee's record", "Base salary PHP 34,000"]],
        src: "Salary history, effective Jun 1, 2026", st: "match" },
      { name: "Rule", rows: [["Rule applied", "Scheme B, 25% of base"], ["Rule assigned to employee", "Scheme A, 20% of base"]],
        src: "Bonus criteria, version 2 (Mar 2026)", st: "miss" },
      { name: "Result", rows: [["Computed in this run", "PHP 8,500"], ["Expected under assigned rule", "PHP 6,800"]],
        src: "PHP 34,000 x 20% = PHP 6,800", st: "miss" }],
    action: "correct", done: "Corrected", outcome: "Corrected from PHP 8,500 to PHP 6,800",
    changes: [["Bonus rule", "Scheme B (25%)", "Scheme A (20%)", "Bonus criteria v2"],
              ["Performance bonus", "PHP 8,500", "PHP 6,800", "PHP 34,000 x 20%"]],
    why: "Scheme B was applied by mistake. The bonus criteria assign Scheme A to Sales Associates.",
    toast: "Bonus for A. Santos corrected to PHP 6,800 and rechecked. All three steps now match." },
  l: { label: "Leave deduction", emp: "M. Lim", role: "Parts Clerk", value: "- PHP 1,000", fixed: "PHP 0",
    priority: "High", impact: "Underpaid by PHP 1,000",
    reason: "Sep 6 absence was deducted, but approved sick leave is on file",
    steps: [
      { name: "Records", rows: [["Time card", "Absent Sep 6, 1 day deducted"], ["Employee's leave record", "Sick leave approved Sep 5"]],
        src: "Time card and digital leave log", st: "miss" },
      { name: "Rule", rows: [["Rule applied", "Unpaid absence"], ["Rule that should apply", "Paid sick leave, 4 days left"]],
        src: "Leave policy", st: "miss" },
      { name: "Result", rows: [["Computed in this run", "- PHP 1,000"], ["Expected under the rule", "PHP 0"]],
        src: "Daily rate PHP 1,000", st: "miss" }],
    action: "correct", done: "Corrected", outcome: "Corrected from - PHP 1,000 to PHP 0",
    changes: [["Absence on Sep 6", "Unpaid absence", "Paid sick leave", "Leave log, approved Sep 5"],
              ["Leave deduction", "- PHP 1,000", "PHP 0", "Leave policy"],
              ["Sick leave balance", "4 days", "3 days", "Leave log"]],
    why: "Approved sick leave was in the leave log but not linked to the time card.",
    toast: "Leave deduction for M. Lim corrected to PHP 0 and rechecked. All three steps now match." },
  f: { label: "Leave deduction", emp: "J. Ramos", role: "Accounting Clerk", value: "- PHP 1,050", fixed: "PHP 0 for now",
    priority: "Medium", impact: "Waiting on supervisor",
    reason: "Sep 11 absence has a leave request still waiting for approval",
    steps: [
      { name: "Records", rows: [["Time card", "Absent Sep 11, 1 day deducted"], ["Employee's leave record", "Requested Sep 10, not approved"]],
        src: "Time card and digital leave log", st: "wait" },
      { name: "Rule", rows: [["Rule applied", "Unpaid absence"], ["Rule if approved", "Paid vacation leave, 6 days left"]],
        src: "Leave policy", st: "wait" },
      { name: "Result", rows: [["Computed in this run", "- PHP 1,050"], ["Expected", "PHP 0 if approved, - PHP 1,050 if not"]],
        src: "Daily rate PHP 1,050", st: "wait" }],
    action: "follow", done: "Needs follow-up", outcome: "No deduction this period; reminder sent to K. Reyes",
    toast: "J. Ramos's leave set to needs follow-up. Reminder sent to K. Reyes. No deduction this period." },
  t: { label: "Withholding tax", emp: "R. Dela Cruz", role: "Service Technician", value: "PHP 1,204.10", fixed: "PHP 1,204.10",
    priority: "Medium", impact: "PHP 400 lower than last period",
    reason: "Withholding is PHP 400 lower than last pay period",
    steps: [
      { name: "Records", rows: [["Taxable pay in payroll", "PHP 18,000 (2 unpaid days)"], ["Employee's record", "2 unpaid leave days, Sep 8 to 9"]],
        src: "Time card and leave log", st: "match" },
      { name: "Rule", rows: [["Rule applied", "Semi-monthly table, PHP 16,667 to 33,332"], ["Rule expected for PHP 18,000", "Same bracket"]],
        src: "Withholding tax table", st: "match" },
      { name: "Result", rows: [["Computed in this run", "PHP 1,204.10"], ["Expected under the rule", "PHP 1,204.10"]],
        src: "PHP 937.50 + 20% of PHP 1,333", st: "match" }],
    action: "check", done: "Checked", outcome: "No change needed",
    toast: "Withholding tax for R. Dela Cruz marked as checked. No change was needed." }
};
var DONE_TONE = { Corrected: "green", Checked: "green", "Needs follow-up": "amber" };

function key(S) { return ORDER.filter(function (k) { return S.indexOf(k) >= 0; }).join(""); }
function listId(S, last) { return "list_" + key(S) + "_" + (last || ""); }
function traceId(X, S) { return "trace_" + X + "_" + key(S); }
function actId(X, S) { return "act_" + X + "_" + key(S); }

// ---------- App chrome ----------
var PH = [["ph_runs", "Payroll runs"], ["ph_records", "Employee records"], ["ph_leave", "Leave log"]];
function shell(id, name, title, sub, homeTo, crumb, activeNav) {
  var s = new Screen(id, name);
  s.rect(0, 0, W, H, { fill: C.bg, name: "Background" });
  s.rect(0, 0, W, 64, { fill: C.surface, stroke: C.line, name: "Top bar" });
  s.rect(24, 18, 28, 28, { fill: C.accent, r: 6, name: "Logo mark" });
  s.text(62, 21, "MotorPH Payroll", { s: 17, wt: "Bold" });
  s.rect(1220, 16, 32, 32, { fill: C.fill, stroke: C.line, r: 16, name: "Avatar" });
  s.text(1262, 16, "Rachel Martinez", { s: 13, wt: "Semi Bold" });
  s.text(1262, 34, "Payroll staff", { s: 12, c: C.ink3 });
  s.rect(0, 64, 240, H - 64, { fill: C.surface, stroke: C.line, name: "Side nav" });
  s.btn(16, 88, 208, "Pre-payroll check", homeTo, activeNav ? "nav" : "navActive");
  PH.forEach(function (p, i) { s.btn(16, 136 + i * 48, 208, p[1], p[0], activeNav === p[0] ? "navActive" : "nav"); });
  s.hr(16, 296, 208);
  s.text(28, 312, "Pay date", { s: 12, c: C.ink3 });
  s.text(28, 330, "Sep 30, 2026", { s: 13, wt: "Semi Bold" });
  var y = 96;
  if (crumb) { s.btn(CX, 92, 300, crumb[0], crumb[1], "link", { h: 28, s: 13 }); y = 128; }
  s.text(CX, y, title, { s: 26, wt: "Semi Bold" });
  s.text(CX, y + 40, sub, { s: 14, c: C.ink2 });
  s.contentTop = y + 80;
  return s;
}

// ---------- Pre-payroll check list ----------
function listScreen(S, last, has, name) {
  var left = ORDER.length - S.length, id = listId(S, last);
  var s = shell(id, name, "Pre-payroll check",
    "Pay period Sep 1 to 15, 2026. Payslips stay with payroll until every flagged figure is handled.", listId(S, ""));
  var follow = S.filter(function (k) { return FIG[k].action === "follow"; }).length;

  if (left > 0) s.btn(W - 32 - 200, 100, 200, "Release payroll", null, "disabled");
  else s.btn(W - 32 - 200, 100, 200, "Release payroll", "released", "primary");
  s.text(W - 32 - 400, 148, left > 0 ? "Locked until " + left + (left === 1 ? " figure is" : " figures are") + " handled"
    : "All figures handled. Ready to release.", { s: 12, w: 400, align: "RIGHT", c: left > 0 ? C.ink3 : C.green, wt: "Medium" });
  s.note(W - 32 - 200, 100, "Locked release (H5)",
    "Payslips can't reach employees while a figure is unhandled. Answers the empathy-map frustration that discrepancies aren't caught until employees flag confusion.");

  var y = s.contentTop;
  if (last) { s.toast(y, FIG[last].toast, FIG[last].action === "follow" ? "amber" : "green");
    s.note(CX + CW, y, "Confirmation message", "Shows that the action worked and what changed (MS2 reflection 3b)."); y += 68; }

  var cw = (CW - 32) / 3;
  [["Figures left to handle", String(left), "of 4 flagged before release", left ? C.red : C.green],
   ["Handled", String(S.length), follow ? follow + " needs follow-up next period" : "Checked, corrected or set to follow-up", C.ink],
   ["Employees in this run", "48", C.ink]].forEach(function (k, i) {
    var x = CX + i * (cw + 16);
    s.card(x, y, cw, 108);
    s.text(x + 20, y + 18, k[0], { s: 13, c: C.ink2 });
    s.text(x + 20, y + 40, k[1], { s: 28, wt: "Semi Bold", c: k[3] });
    s.text(x + 20, y + 80, k[2], { s: 12, c: C.ink3, w: cw - 40 });
  });
  s.note(CX + cw, y, "Figures left count (H5)", "Explains why release is locked and how close Rachel is to releasing.");
  y += 124;
  var bw = (CW - 24) / 4;
  ORDER.forEach(function (k, i) {
    var done = S.indexOf(k) >= 0;
    s.rect(CX + i * (bw + 8), y, bw, 6, { fill: done ? (FIG[k].action === "follow" ? C.amber : C.green) : C.line, r: 3, name: "Progress segment" });
  });

  y += 22;
  var RH = 72, hh = 76 + 40 + ORDER.length * RH + 8;
  s.card(CX, y, CW, hh, "Flagged figures");
  s.text(CX + 20, y + 44, "Found before any payslip was sent. Sorted by priority: High means pay is likely wrong by more than PHP 500.",
    { s: 13, c: C.ink2 });
  var cols = [20, 120, 300, 440, 840, 1000];
  s.rect(CX + 1, y + 76, CW - 2, 40, { fill: C.fill, name: "Table header" });
  ["Priority", "Figure", "Employee", "Why it was flagged", "Status", ""].forEach(function (h, i) {
    s.text(CX + cols[i], y + 88, h, { s: 12, wt: "Semi Bold", c: C.ink2 }); });
  s.note(CX + 92, y + 96, "Priority and sort order (H1)",
    "Answers 'where do I start?'. High figures first; the follow-up figure comes before the low-risk tax check because it waits on someone else.");
  s.note(CX + cols[3] + 160, y + 96, "One list, many record types",
    "Bonus, leave and tax together show the recurring pattern across Rachel, Melissa and Miguel (MS1 1.3), not one incident.");
  ORDER.forEach(function (k, i) {
    var f = FIG[k], ry = y + 116 + i * RH, done = S.indexOf(k) >= 0;
    if (i) s.hr(CX + 20, ry, CW - 40);
    s.pill(CX + cols[0], ry + 24, f.priority, f.priority === "High" ? "red" : "neutral");
    s.text(CX + cols[1], ry + 16, f.label, { s: 14, wt: "Semi Bold" });
    s.text(CX + cols[1], ry + 38, done ? f.fixed : f.value, { s: 13, c: C.ink2 });
    s.text(CX + cols[2], ry + 16, f.emp, { s: 14, wt: "Medium" });
    s.text(CX + cols[2], ry + 38, f.role, { s: 12, c: C.ink3 });
    s.text(CX + cols[3], ry + 16, f.reason, { s: 14, w: 370, c: done ? C.ink3 : C.ink });
    s.pill(CX + cols[4], ry + 24, done ? f.done : "To check", done ? DONE_TONE[f.done] : "neutral");
    if (done) s.text(CX + cols[5], ry + 26, "Done", { s: 13, c: C.ink3, w: 116, align: "CENTER" });
    else { var to = has(traceId(k, S)) ? traceId(k, S) : null;
      s.btn(CX + cols[5], ry + 17, 116, "Trace", to, "secondary", { h: 38 }); }
  });
  s.text(CX, y + hh + 16, "Every figure is traced the same way: 1 Records, 2 Rule, 3 Result.", { s: 13, c: C.ink3 });
  return s;
}

// ---------- Three-step trace ----------
function traceScreen(X, S, name) {
  var f = FIG[X], id = traceId(X, S), back = listId(S, "");
  var s = shell(id, name, "Trace: " + f.label,
    f.emp + ", " + f.role + ". Pay period Sep 1 to 15, 2026.", back, ["Back to pre-payroll check", back]);
  var nMatch = f.steps.filter(function (st) { return st.st === "match"; }).length;
  var wait = f.steps.some(function (st) { return st.st === "wait"; });
  var kind = nMatch === 3 ? "match" : wait ? "wait" : "miss";

  var y = s.contentTop;
  s.card(CX, y, CW, 104);
  s.text(CX + 20, y + 18, "Figure in this run", { s: 13, c: C.ink2 });
  s.text(CX + 20, y + 42, f.value, { s: 28, wt: "Semi Bold" });
  s.text(CX + 300, y + 18, "Why it was flagged", { s: 13, c: C.ink2 });
  s.text(CX + 300, y + 44, f.reason, { s: 15, wt: "Medium", w: 480 });
  s.text(CX + CW - 20 - 280, y + 18, "Compared with the employee's record", { s: 13, c: C.ink2, w: 280, align: "RIGHT" });
  var ov = { match: ["Matches", "green"], miss: ["Doesn't match", "red"], wait: ["Waiting on supervisor", "amber"] }[kind];
  var ow = pillW(ov[0], 14) + 8;
  s.pill(CX + CW - 20 - ow, y + 46, ov[0], ov[1], true);

  y += 120;
  var sw = (CW - 32) / 3, sh = 300;
  s.note(CX, y, "Three-step trace (POV)",
    "Records, Rule, Result answers the POV need to confirm and explain how a figure was calculated, and Rachel's 'I just need to see how this number was actually generated.'");
  f.steps.forEach(function (st, i) {
    var x = CX + i * (sw + 16), tone = STEP_TONE[st.st];
    s.card(x, y, sw, sh);
    if (st.st !== "match") s.rect(x, y, 4, sh, { fill: st.st === "wait" ? C.amber : C.red, r: 2, name: "Status marker" });
    s.rect(x + 20, y + 20, 28, 28, { fill: C.accentSoft, r: 14, name: "Step number" });
    s.text(x + 20, y + 25, String(i + 1), { s: 13, wt: "Semi Bold", c: C.accent, w: 28, align: "CENTER" });
    s.text(x + 60, y + 23, st.name, { s: 16, wt: "Semi Bold" });
    var lw = pillW(tone[0]);
    s.pill(x + sw - 20 - lw, y + 22, tone[0], tone[1]);
    st.rows.forEach(function (r, j) {
      var ry = y + 68 + j * 74;
      if (j) s.hr(x + 20, ry - 10, sw - 40);
      s.text(x + 20, ry, r[0], { s: 12, c: C.ink3 });
      s.text(x + 20, ry + 20, r[1], { s: 15, wt: "Semi Bold", w: sw - 40, c: st.st === "miss" && j === 0 ? C.red : C.ink });
    });
    s.hr(x + 20, y + 214, sw - 40);
    s.text(x + 20, y + 228, i === 2 ? "How it is worked out" : "Source", { s: 12, c: C.ink3 });
    s.text(x + 20, y + 248, st.src, { s: 13, c: C.ink2, w: sw - 40 });
  });
  s.note(CX + sw, y, "Match labels (H2)",
    "Match, Doesn't match and Can't confirm yet show disagreements at a glance. Mirrors the pain that salary records can silently disagree with employee documents.");
  s.note(CX + 2 * sw + 16, y + 214, "Named sources",
    "Each step names its source, replacing Rachel's 'tracking down information after the fact'.");

  y += sh + 16;
  s.card(CX, y, CW, 150, "Is this figure right?");
  var guide = { match: "All three steps match the employee's record. Mark the figure as checked.",
    miss: (3 - nMatch) + " of 3 steps don't match the employee's record. Correct it, and the check runs again.",
    wait: "This figure depends on a leave approval that hasn't happened yet. Set it for follow-up so it doesn't block release." }[kind];
  s.text(CX + 20, y + 50, guide, { s: 14, c: C.ink2, w: 440 });
  var acts = [
    ["Mark as checked", "Confirms the figure as it is", "match", listId(S.concat([X]), X)],
    ["Correct and recheck", "Shows every change before saving", "miss", actId(X, S)],
    ["Needs follow-up", "For figures waiting on someone else", "wait", actId(X, S)]];
  acts.forEach(function (a, i) {
    var bx = CX + CW - 20 - (3 - i) * 200 - (2 - i) * 12, on = a[2] === kind;
    s.btn(bx, y + 44, 200, a[0], on ? a[3] : null, on ? "primary" : "disabled");
    s.text(bx, y + 92, a[1], { s: 12, c: on ? C.ink2 : C.ink3, w: 200, align: "CENTER" });
  });
  s.note(CX + CW, y, "Only the right action is enabled (H3, H4)",

// ---------- Build ----------
function subsets(arr) {
  var out = [[]];
  arr.forEach(function (k) { out = out.concat(out.map(function (s) { return s.concat([k]); })); });
  return out;
}
function buildSpec(mode) {
  var want = [["overview"]];
  if (mode === "full") {
    subsets(ORDER).forEach(function (S) {
      want.push(["list", S, ""]);
      S.forEach(function (k) { want.push(["list", S, k]); });
      ORDER.forEach(function (X) { if (S.indexOf(X) < 0) { want.push(["trace", X, S]); if (FIG[X].action !== "check") want.push(["act", X, S]); } });
    });
    want.push(["released"]);
  } else {
    var S = [];
    want.push(["list", [], ""]);
    ORDER.forEach(function (X) {
      want.push(["trace", X, S.slice()]);
      if (FIG[X].action !== "check") want.push(["act", X, S.slice()]);
      S.push(X);
      want.push(["list", S.slice(), X]);
    });
    want.push(["released"]);
    var B = [];
    ORDER.forEach(function (X) { B.push(X); want.push(["list", B.slice(), ""]); });
  }
  PH.forEach(function (p) { want.push(["ph", p[0], p[1]]); });

  var ids = {};
  function wid(w) { return w[0] === "list" ? listId(w[1], w[2]) : w[0] === "trace" ? traceId(w[1], w[2]) :
    w[0] === "act" ? actId(w[1], w[2]) : w[0] === "ph" ? w[1] : w[0]; }
  want.forEach(function (w) { ids[wid(w)] = 1; });
  function has(id) { return !!ids[id]; }
  var n = -1;
  function nm(t) { n++; return (n < 10 ? "0" : "") + n + " " + t; }
  return want.map(function (w) {
    if (w[0] === "overview") return overview(nm("Flow overview"));
    if (w[0] === "list") {
      var left = 4 - w[1].length;
      var t = "Check list, " + left + " left" + (w[2] ? ", " + FIG[w[2]].done.toLowerCase() + " message" : (w[1].length ? ", back state" : ""));
      return listScreen(w[1], w[2], has, nm(t));
    }
    if (w[0] === "trace") return traceScreen(w[1], w[2], nm("Trace " + FIG[w[1]].label.toLowerCase() + ", " + FIG[w[1]].emp));
    if (w[0] === "act") return FIG[w[1]].action === "follow" ? followScreen(w[1], w[2], nm("Follow-up, " + FIG[w[1]].emp))
      : correctScreen(w[1], w[2], nm("Correction, " + FIG[w[1]].emp));
    if (w[0] === "ph") return placeholder(w[1], w[2], nm("Placeholder, " + w[2]));
    return releasedScreen(nm("Payroll released"));
  });
}
// Clickable HTML preview: renders each state on demand from the shared spec.
(function () {
  var screens = buildSpec("full").filter(function (sc) { return sc.id !== "overview"; }), spec = {}, built = {}, stack = [], cur = null, notesOn = false;
  screens.forEach(function (sc) { spec[sc.id] = sc; });
  var root = document.getElementById("stage"), label = document.getElementById("label"), panel = document.getElementById("notes");
  function wt(w) { return { "Regular": 400, "Medium": 500, "Semi Bold": 600, "Bold": 700 }[w]; }
  function el(tag, cls) { var d = document.createElement(tag); if (cls) d.className = cls; return d; }
  function build(sc) {
    var f = el("div", "frame"); f.id = "s-" + sc.id; f.style.width = sc.w + "px"; f.style.height = sc.h + "px";
    f.setAttribute("role", "region"); f.setAttribute("aria-label", sc.name.slice(3));
    sc.els.forEach(function (e) {
      var d;
      if (e.k === "rect") {
        d = el("div", "el"); d.style.cssText = "left:" + e.x + "px;top:" + e.y + "px;width:" + e.w + "px;height:" + e.h + "px;border-radius:" + e.r + "px;" +
          (e.fill ? "background:" + e.fill + ";" : "") + (e.stroke ? (e.dash ? "border:1px dashed " + e.stroke : "box-shadow:inset 0 0 0 1px " + e.stroke) + ";" : "");
        d.setAttribute("aria-hidden", "true");
      } else if (e.k === "text") {
        d = el("div", "el"); d.textContent = e.v;
        d.style.cssText = "left:" + e.x + "px;top:" + e.y + "px;font-size:" + e.s + "px;line-height:" + (e.s * 1.4) + "px;font-weight:" + wt(e.wt) +
          ";color:" + e.c + ";text-align:" + e.align.toLowerCase() + ";" + (e.w ? "width:" + e.w + "px;" : "white-space:nowrap;") + (e.u ? "text-decoration:underline;" : "");
      } else if (e.k === "tri") {
        d = el("div", "el tri"); var a = 7, b = 12, c = e.fill, css;
        if (e.dir === "r") css = "left:" + (e.x - b) + "px;top:" + (e.y - a) + "px;border-width:" + a + "px 0 " + a + "px " + b + "px;border-color:transparent transparent transparent " + c;
        if (e.dir === "l") css = "left:" + e.x + "px;top:" + (e.y - a) + "px;border-width:" + a + "px " + b + "px " + a + "px 0;border-color:transparent " + c + " transparent transparent";
        if (e.dir === "d") css = "left:" + (e.x - a) + "px;top:" + (e.y - b) + "px;border-width:" + b + "px " + a + "px 0 " + a + "px;border-color:" + c + " transparent transparent transparent";
        if (e.dir === "u") css = "left:" + (e.x - a) + "px;top:" + e.y + "px;border-width:0 " + a + "px " + b + "px " + a + "px;border-color:transparent transparent " + c + " transparent";
        d.style.cssText = css; d.setAttribute("aria-hidden", "true");
      } else {
        var b2 = BTN[e.variant], al = (e.align || b2.align).toLowerCase();
        d = el("button", "el"); d.type = "button"; d.textContent = e.v;
        d.style.cssText = "left:" + e.x + "px;top:" + e.y + "px;width:" + e.w + "px;height:" + e.h + "px;border-radius:" + b2.r + "px;background:" + (b2.fill || "transparent") +
          ";box-shadow:" + (b2.stroke ? "inset 0 0 0 1px " + b2.stroke : "none") + ";color:" + b2.c + ";font-size:" + e.s + "px;font-weight:" + wt(b2.wt) +
          ";text-align:" + al + ";padding:0 " + (b2.pad || 0) + "px;" + (b2.u ? "text-decoration:underline;" : "");
        if (e.to) { d.dataset.to = e.to; d.classList.add("link"); } else { d.disabled = true; d.setAttribute("aria-disabled", "true"); }
      }
      f.appendChild(d);
    });
    root.appendChild(f); built[sc.id] = f; return f;
  }
  function renderNotes(sc) {
    panel.innerHTML = "";
    if (!notesOn || !sc.notes.length) { panel.hidden = true; return; }
    panel.hidden = false;
    var h = el("h2"); h.textContent = "Design notes for this screen"; panel.appendChild(h);
    var ol = el("ol");
    sc.notes.forEach(function (n) { var li = el("li"), b = el("strong"); b.textContent = n.t; li.appendChild(b);
      li.appendChild(document.createTextNode(" " + n.v)); ol.appendChild(li); });
    panel.appendChild(ol);
  }
  function show(id, push) {
    if (!spec[id]) return;
    if (push && cur) stack.push(cur);
    Object.keys(built).forEach(function (k) { built[k].style.display = "none"; });
    (built[id] || build(spec[id])).style.display = "block";
    cur = id; label.textContent = spec[id].name.slice(3);
    document.body.classList.toggle("notes-on", notesOn);
    renderNotes(spec[id]); fit(); history.replaceState(null, "", "#" + id);
  }
  root.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-to]"); if (!t) return;
    if (t.dataset.to === "@back") show(stack.pop() || "list__", false); else show(t.dataset.to, true);
  });
  document.getElementById("restart").onclick = function () { stack = []; show("list__", false); };
  function fit() { var s = Math.min(1, (window.innerWidth - 32) / 1440); root.style.transform = "scale(" + s + ")"; root.style.height = (1024 * s) + "px"; }
  window.addEventListener("resize", fit);
  window.showScreen = function (id) { show(id, false); };
  var h0 = (location.hash || "").slice(1); show(spec[h0] ? h0 : "list__", false);
})();
